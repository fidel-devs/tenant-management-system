<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password - RentHome</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:420px;margin:60px auto;padding:0 16px;color:#1f2937}
 input,button{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #d1d5db;font-size:16px;box-sizing:border-box}
 button{background:#16a34a;color:#fff;border:0;font-weight:600;cursor:pointer}
</style></head><body>
<h2>Choose a new password</h2>
<input id="p1" type="password" placeholder="New password (8+ characters)" autocomplete="new-password">
<input id="p2" type="password" placeholder="Repeat the new password" autocomplete="new-password">
<button onclick="save()">Change password</button>
<div id="msg"></div>
<p><a href="/">← Back to the site</a></p>
<script>
async function save() {
  const msg = document.getElementById('msg');
  const p1 = document.getElementById('p1').value, p2 = document.getElementById('p2').value;
  if (p1 !== p2) { msg.textContent = 'The two passwords do not match.'; return; }
  const token = new URLSearchParams(location.search).get('token');
  const r = await fetch('/api/auth/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, password: p1 }) });
  const d = await r.json().catch(() => ({}));
  msg.textContent = d.message || d.error || 'Something went wrong.';
}
</script>
</body>
</html>
